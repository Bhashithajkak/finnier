spring.application.name=finnier

spring.datasource.url=jdbc:mysql://localhost:3306/${SPRING_DATASOURCE_DATABASE}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USER}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.user.name=${SPRING_SECURITY_USERNAME}
spring.security.user.password=${SPRING_SECURITY_PASSWORD}

security.jwt.secret-key=${JWT_SECRET_KEY}
#15 min
security.jwt.access-token-expiration-time=900000 
#7 days
security.jwt.refresh-token-expiration-time=604800000

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_AUTO_STARTUP:true}

# Messaging Topics and Queues
rabbitmq.exchange.order=order.exchange
rabbitmq.queue.order-created=order.created.queue
rabbitmq.queue.order-status=order.status.queue
rabbitmq.routing-key.order-created=order.created
rabbitmq.routing-key.order-status=order.status
rabbitmq.queue.payment-completed=payment.completed.queue
rabbitmq.queue.payment-failed=payment.failed.queue
rabbitmq.queue.payment-refunded=payment.refunded.queue
rabbitmq.routing-key.payment-complete=payment.completed
rabbitmq.routing-key.payment-failed=payment.failed
rabbitmq.routing-key.payment-refunded=payment.refunded

# Payment Gateway
payment.webhook.secret= ${PAYMENT_WEBHOOK_SECRET}