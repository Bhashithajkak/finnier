spring.application.name=finnier

spring.datasource.url = jdbc:h2:mem:testdb
spring.datasource.driverClassName = org.h2.Driver
spring.datasource.username = fa
spring.datasource.password

spring.security.user.name=${SPRING_SECURITY_USERNAME}
spring.security.user.password=${SPRING_SECURITY_PASSWORD}

security.jwt.secret-key=${JWT_SECRET_KEY}
#15 min
security.jwt.access-token-expiration-time=900000 
#7 days
security.jwt.refresh-token-expiration-time=604800000
